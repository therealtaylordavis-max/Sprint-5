<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Scout</title>
<meta name="description" content="An honest career coach that finds open roles at the companies you choose.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --page:#fbf8f4; --card:#ffffff; --soft:#f5f1ec; --line:#ece6de;
    --ink:#2b2a33; --ink-2:#5e5b68; --ink-3:#8f8b97;
    --lavender:#e8e5fb; --lavender-ink:#3f3a8c; --lavender-strong:#b9b2f0;
    --peach:#fde8df; --peach-ink:#8a3f22;
    --mint:#dff4ea; --mint-ink:#1f6b4a;
    --butter:#fdf3d6; --butter-ink:#7a5a00;
    --sky:#e1edfb; --sky-ink:#24548f;
    --rose:#fbe3ec; --rose-ink:#8c2f52;
    --bar:#b9b2f0;
    --danger:#b3261e;
    --shadow:0 1px 2px rgba(43,42,51,.05),0 10px 30px -18px rgba(43,42,51,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#17161b; --card:#201f26; --soft:#29282f; --line:#34323b;
      --ink:#f3f1f7; --ink-2:#c4c1cc; --ink-3:#8f8b97;
      --lavender:#35325a; --lavender-ink:#d9d5ff; --lavender-strong:#8b83e0;
      --peach:#4a3129; --peach-ink:#ffd2c0;
      --mint:#233d33; --mint-ink:#bfeed8;
      --butter:#433a20; --butter-ink:#fbe7a6;
      --sky:#243447; --sky-ink:#c6dcf7;
      --rose:#46293a; --rose-ink:#f8c9dc;
      --bar:#8b83e0; --danger:#ff8a80;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#17161b; --card:#201f26; --soft:#29282f; --line:#34323b;
    --ink:#f3f1f7; --ink-2:#c4c1cc; --ink-3:#8f8b97;
    --lavender:#35325a; --lavender-ink:#d9d5ff; --lavender-strong:#8b83e0;
    --peach:#4a3129; --peach-ink:#ffd2c0;
    --mint:#233d33; --mint-ink:#bfeed8;
    --butter:#433a20; --butter-ink:#fbe7a6;
    --sky:#243447; --sky-ink:#c6dcf7;
    --rose:#46293a; --rose-ink:#f8c9dc;
    --bar:#8b83e0; --danger:#ff8a80;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 Nunito,system-ui,-apple-system,sans-serif}
  a{color:var(--lavender-ink);font-weight:700}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{max-width:1360px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(340px,5fr) 7fr;grid-template-rows:auto minmax(0,1fr);gap:16px;height:100dvh}

  header{grid-column:1/-1;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:12px;background:var(--lavender);display:grid;place-items:center}
  .brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .brand span{font-size:13px;color:var(--ink-2)}
  .grow{flex:1}
  .pill-btn{border:0;background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--ink-2)}
  .pill-btn:hover{background:var(--line)}
  .banner{grid-column:1/-1;background:var(--butter);color:var(--butter-ink);border-radius:14px;padding:10px 14px;font-size:14px}

  .card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* Chat */
  .tracking{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
  .tracking .t{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px;font-weight:700}
  .chip button{border:0;background:transparent;cursor:pointer;opacity:.6;font-size:15px;line-height:1;padding:0 4px}
  .chip button:hover{opacity:1}
  .chip.warn{background:var(--soft);color:var(--ink-3);text-decoration:line-through}
  .none{font-size:14px;color:var(--ink-3)}
  .msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row.me{justify-content:flex-end}
  .avatar{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lavender);display:grid;place-items:center}
  .bubble{border-radius:18px;padding:10px 14px;max-width:88%}
  .me .bubble{background:var(--lavender);color:var(--lavender-ink);border-bottom-right-radius:6px;white-space:pre-wrap;font-weight:600}
  .bot .bubble{background:var(--soft);border-top-left-radius:6px;min-width:0}
  .bot .bubble > :first-child{margin-top:0}.bot .bubble > :last-child{margin-bottom:0}
  .bot .bubble table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0 10px;display:block;overflow-x:auto}
  .bot .bubble th,.bot .bubble td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  .bot .bubble th{color:var(--ink-2)}
  .bot .bubble h3{font-size:15px;margin:12px 0 2px}
  .step{font-size:13px;color:var(--ink-3);padding-left:40px}
  .err{color:var(--danger);font-size:14px;padding-left:40px}
  .dots{display:inline-flex;gap:4px;padding:4px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--lavender-strong);animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .ideas{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
  .ideas button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);font-weight:600}
  .ideas button:hover{background:var(--soft)}
  form{display:flex;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--page);border-radius:16px;padding:10px 14px;min-height:46px;max-height:140px;outline:none}
  textarea:focus{border-color:var(--lavender-strong)}
  .send{border:0;border-radius:16px;background:var(--lavender-strong);color:#221f52;font-weight:800;padding:0 18px;cursor:pointer}
  .send:disabled{opacity:.5;cursor:default}

  /* Matches */
  .matches{overflow:auto}
  .m-head{padding:18px 20px 4px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .m-head h2{margin:0;font-size:20px;font-weight:800}
  .m-head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
  .linkish{border:0;background:none;color:var(--lavender-ink);font-weight:700;cursor:pointer;padding:4px 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 20px}
  .stat{border-radius:16px;padding:12px 14px}
  .stat b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;font-weight:600}
  .s1{background:var(--lavender);color:var(--lavender-ink)} .s2{background:var(--mint);color:var(--mint-ink)} .s3{background:var(--peach);color:var(--peach-ink)}
  .filters{position:sticky;top:0;z-index:2;background:var(--card);padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
  .search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--page);border-radius:999px;padding:8px 14px;outline:none}
  .search:focus{border-color:var(--lavender-strong)}
  .toggle{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink-2)}
  .toggle[aria-pressed="true"]{background:var(--lavender);border-color:transparent;color:var(--lavender-ink)}
  select.toggle{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
  .section{padding:14px 20px 4px}
  .section h3{margin:0 0 6px;font-size:15px;font-weight:800}
  .hint{font-size:12.5px;color:var(--ink-3);margin:0 0 6px}
  svg text{fill:var(--ink-2);font-size:13px;font-family:Nunito,system-ui,sans-serif;font-weight:600}
  svg text.v{fill:var(--ink);font-weight:800}
  svg .hit{fill:transparent;cursor:pointer}
  svg .off{opacity:.3}
  .company{margin:12px 20px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .company-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--soft)}
  .initial{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
  .company-head b{font-size:15px}
  .company-head small{color:var(--ink-3);font-weight:600}
  .company-head a{margin-left:auto;font-size:13px}
  .job{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
  .job:first-of-type{border-top:0}
  .job .title{font-weight:700;color:var(--ink);text-decoration:none}
  .job .title:hover{color:var(--lavender-ink);text-decoration:underline}
  .job .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--ink-2)}
  .tag{border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
  .tag.pay{background:var(--mint);color:var(--mint-ink)} .tag.remote{background:var(--sky);color:var(--sky-ink)} .tag.nopay{background:var(--soft);color:var(--ink-3)}
  .view{grid-row:1/3;grid-column:2;border-radius:999px;background:var(--lavender);color:var(--lavender-ink);padding:6px 14px;font-size:13px;text-decoration:none;white-space:nowrap}
  .view:hover{background:var(--lavender-strong);color:#221f52}
  .zero{padding:12px 14px;font-size:14px;color:var(--ink-2)}
  .zero.bad{color:var(--danger)}
  details{margin:8px 20px 20px;font-size:14px;color:var(--ink-2)}
  details summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
  details table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  details th,details td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  details td.n,details th.n{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:48px 28px;text-align:center;color:var(--ink-2);margin:auto}
  .empty h2{color:var(--ink);font-size:20px;margin:16px 0 6px}
  .steps{display:grid;gap:10px;max-width:340px;margin:18px auto 0;text-align:left}
  .steps div{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;font-weight:600}
  .steps em{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
  .tip{position:fixed;pointer-events:none;z-index:50;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:13px;display:none}
  .tip b{display:block}
  @media (max-width: 960px){
    .app{grid-template-columns:1fr;height:auto;grid-template-rows:auto}
    .chat{height:78dvh}
  }
  @media (max-width: 520px){
    .stats{grid-template-columns:repeat(3,1fr);gap:6px}
    .stat b{font-size:20px}
    .brand span{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--lavender-ink)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </div>
    <div class="brand"><b>Job Scout</b><span>Your honest career coach</span></div>
    <span class="grow"></span>
    <button class="pill-btn" id="newChat" title="Clear the chat (keeps your companies)">New chat</button>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section class="card chat" aria-label="Chat">
    <div class="tracking"><div class="t">Companies you're tracking</div><div class="chips" id="chips"></div></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="ideas" id="ideas"></div>
    <form id="compose">
      <textarea id="input" rows="1" placeholder="Ask about jobs or add companies…" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </section>

  <section class="card matches" id="matches" aria-label="Your matches"></section>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem("jobscout:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jobscout:" + k, JSON.stringify(v)); } catch {} },
};

const state = {
  messages: store.get("messages", []),
  employers: store.get("employers", []),
  results: store.get("results", null),
  busy: false, error: "",
  f: { q: "", company: "", remote: false, pay: false },
};

// Pastel tints are decoration only; every company is always labeled by name.
const TINTS = [["--sky", "--sky-ink"], ["--peach", "--peach-ink"], ["--mint", "--mint-ink"], ["--butter", "--butter-ink"], ["--rose", "--rose-ink"], ["--lavender", "--lavender-ink"]];
const tint = (name) => {
  const i = Math.max(0, state.employers.findIndex((e) => e.name === name));
  const [bg, fg] = TINTS[i % TINTS.length];
  return `background:var(${bg});color:var(${fg})`;
};
const money = (n) => n == null ? "" : n >= 1000 ? "$" + Math.round(n / 1000) + "K" : "$" + n;

marked.setOptions({ gfm: true });
DOMPurify.addHook("afterSanitizeAttributes", (n) => { if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); } });
const md = (t) => DOMPurify.sanitize(marked.parse(t || ""));
const BOT_ICON = `<div class="avatar" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--lavender-ink)" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>`;

/* ---------- Chat ---------- */
const textOf = (content) => (content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n\n");

function renderChips() {
  const el = $("#chips");
  el.innerHTML = !state.employers.length
    ? '<span class="none">None yet. Tell me where you\'d like to work.</span>'
    : state.employers.map((e, i) => `<span class="chip ${e.ats === "not_found" ? "warn" : ""}" style="${e.ats === "not_found" ? "" : tint(e.name)}" title="${esc(e.ats === "not_found" ? "Couldn't find a job board for this company" : e.boardUrl || "")}">
        ${esc(e.name)}<button aria-label="Stop tracking ${esc(e.name)}" data-rm="${i}">×</button></span>`).join("");
}

function renderChat() {
  const out = [];
  if (!state.messages.length) {
    out.push(`<div class="row bot">${BOT_ICON}<div class="bubble">${md("Hi! I'm Job Scout. Tell me a few companies you'd love to work at and the kind of role you want. I'll find what's open and give you my honest take.\n\nTip: **two or more companies** works best.")}</div></div>`);
  }
  for (const m of state.messages) {
    if (m.role === "user") { const t = textOf(m.content); if (t) out.push(`<div class="row me"><div class="bubble">${esc(t)}</div></div>`); continue; }
    for (const b of m.content) if (b.type === "tool_use") {
      out.push(`<div class="step">${b.name === "update_employer_list" ? `Updating your company list…` : `Searching job boards for "${esc(b.input.role_query)}"…`}</div>`);
    }
    const t = textOf(m.content);
    if (t) out.push(`<div class="row bot">${BOT_ICON}<div class="bubble">${md(t)}</div></div>`);
  }
  if (state.busy) out.push(`<div class="row bot">${BOT_ICON}<div class="bubble"><span class="dots" aria-label="Working"><i></i><i></i><i></i></span></div></div>`);
  if (state.error) out.push(`<div class="err">${esc(state.error)}</div>`);
  const el = $("#msgs"); el.innerHTML = out.join(""); el.scrollTop = el.scrollHeight;

  const ideas = state.employers.length < 2
    ? ["Track Stripe, Figma, and Airbnb", "Track Notion, Ramp, and Duolingo"]
    : ["Find product manager roles", "Any remote marketing jobs?", "Is my company list good enough?"];
  $("#ideas").innerHTML = state.busy ? "" : ideas.map((s) => `<button type="button">${esc(s)}</button>`).join("");
}

async function send(text) {
  if (state.busy || !text.trim()) return;
  const prev = state.messages;
  state.busy = true; state.error = "";
  state.messages = [...prev, { role: "user", content: [{ type: "text", text }] }];
  renderChat(); $("#send").disabled = true;
  try {
    const headers = { "content-type": "application/json" };
    const pass = store.get("passcode", ""); if (pass) headers["x-app-passcode"] = pass;
    const res = await fetch("/api/chat", { method: "POST", headers, body: JSON.stringify({ message: text, messages: prev, employers: state.employers }) });
    const data = await res.json().catch(() => ({ error: `Server returned ${res.status}` }));
    if (res.status === 401) {
      const p = prompt("This Job Scout needs a passcode:");
      if (p) { store.set("passcode", p); state.messages = prev; state.busy = false; return send(text); }
    }
    if (!res.ok) throw new Error(data.error || `Something went wrong (${res.status}).`);
    state.messages = data.messages; state.employers = data.employers;
    if (data.results) { state.results = data.results; state.f = { q: "", company: "", remote: false, pay: false }; }
    store.set("messages", state.messages); store.set("employers", state.employers); store.set("results", state.results);
  } catch (err) {
    state.messages = prev; state.error = err.message; $("#input").value = text;
  } finally {
    state.busy = false; $("#send").disabled = false;
    renderChips(); renderChat(); renderMatches();
  }
}

$("#compose").addEventListener("submit", (e) => { e.preventDefault(); const t = $("#input").value; $("#input").value = ""; send(t); });
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#compose").requestSubmit(); } });
$("#ideas").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
$("#chips").addEventListener("click", (e) => { const i = e.target.dataset.rm; if (i == null) return; state.employers.splice(+i, 1); store.set("employers", state.employers); renderChips(); });
$("#newChat").addEventListener("click", () => { state.messages = []; state.error = ""; store.set("messages", []); renderChat(); });

/* ---------- Matches ---------- */
function visibleRoles() {
  const { q, company, remote, pay } = state.f, needle = q.trim().toLowerCase();
  return (state.results?.roles || []).filter((r) =>
    (!needle || `${r.title} ${r.location} ${r.company}`.toLowerCase().includes(needle)) &&
    (!company || r.company === company) && (!remote || r.remote) && (!pay || r.payMin != null));
}

function renderMatches() {
  const el = $("#matches"), R = state.results;
  if (!R) {
    el.innerHTML = `<div class="empty">
      <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="var(--lavender)"/><rect x="26" y="34" width="44" height="32" rx="8" fill="var(--card)"/><rect x="38" y="27" width="20" height="10" rx="4" fill="none" stroke="var(--lavender-ink)" stroke-width="3"/><path d="M26 46h44" stroke="var(--lavender-strong)" stroke-width="3"/></svg>
      <h2>Your matches will show up here</h2><p>Every role links straight to the real posting.</p>
      <div class="steps">
        <div><em style="background:var(--sky);color:var(--sky-ink)">1</em>Name companies you like</div>
        <div><em style="background:var(--peach);color:var(--peach-ink)">2</em>Ask for a type of job</div>
        <div><em style="background:var(--mint);color:var(--mint-ink)">3</em>Browse, filter, and apply</div>
      </div></div>`;
    return;
  }
  const focused = document.activeElement?.id;
  const roles = visibleRoles();
  const withPay = roles.filter((r) => r.payMin != null);
  const hiring = R.companies.filter((c) => roles.some((r) => r.company === c.company)).length;
  const loc = R.query.location && R.query.location !== "any" ? ` in ${R.query.location}` : "";
  const f = state.f;

  el.innerHTML = `
    <div class="m-head"><div><h2>Your matches</h2><p>"${esc(R.query.role)}"${esc(loc)}${R.query.remote_only ? ", remote only" : ""} · updated ${new Date(R.ranAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</p></div>
      <span class="grow"></span><button class="linkish" id="csv">Download list</button></div>
    <div class="stats">
      <div class="stat s1"><b>${roles.length}</b><span>open roles</span></div>
      <div class="stat s2"><b>${hiring} of ${R.companies.length}</b><span>companies hiring</span></div>
      <div class="stat s3"><b>${withPay.length}</b><span>show pay</span></div>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Search roles or locations" value="${esc(f.q)}" aria-label="Search roles">
      <select class="toggle" id="co" aria-label="Company"><option value="">All companies</option>${R.companies.map((c) => `<option ${f.company === c.company ? "selected" : ""}>${esc(c.company)}</option>`).join("")}</select>
      <button class="toggle" id="remote" aria-pressed="${f.remote}">Remote</button>
      <button class="toggle" id="pay" aria-pressed="${f.pay}">Shows pay</button>
    </div>
    ${R.companies.length > 1 ? `<div class="section"><h3>Roles by company</h3><p class="hint">Tap a bar to see just that company.</p><div id="bars"></div></div>` : ""}
    <div id="list"></div>
    <details><summary>How I searched</summary>
      <p style="margin:8px 0 0">I checked each company's own job board, kept titles matching <b>${esc(R.query.keywords.join(", "))}</b>, then applied your location filter. Pay comes from the posting itself.</p>
      <table><thead><tr><th>Company</th><th>Job board</th><th class="n">Checked</th><th class="n">Matched</th></tr></thead>
      <tbody>${R.companies.map((c) => `<tr><td>${esc(c.company)}</td><td>${c.board_url ? `<a href="${esc(c.board_url)}" target="_blank" rel="noopener">${esc(boardName(c.job_board))}</a>` : esc(boardName(c.job_board))}</td><td class="n">${c.scanned}</td><td class="n">${c.matched}</td></tr>`).join("")}</tbody></table>
    </details>`;

  if (R.companies.length > 1) drawBars(roles);
  drawList(roles);
  const re = () => renderMatches();
  $("#q").addEventListener("input", (e) => { f.q = e.target.value; re(); });
  $("#co").addEventListener("change", (e) => { f.company = e.target.value; re(); });
  $("#remote").addEventListener("click", () => { f.remote = !f.remote; re(); });
  $("#pay").addEventListener("click", () => { f.pay = !f.pay; re(); });
  $("#csv").addEventListener("click", () => download(roles));
  if (focused === "q") { const i = $("#q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

const boardName = (ats) => ({ greenhouse: "Greenhouse", lever: "Lever", ashby: "Ashby", workday: "Workday", smartrecruiters: "SmartRecruiters", workable: "Workable", recruitee: "Recruitee", careers_page: "Careers page", not_found: "Not found" })[ats] || ats;

const tip = $("#tip");
function showTip(html, e) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => (tip.style.display = "none");

function drawBars(roles) {
  const el = $("#bars"), R = state.results;
  const data = R.companies.map((c) => ({ c, n: roles.filter((r) => r.company === c.company).length }));
  const W = Math.max(260, el.clientWidth), rowH = 34, labelW = Math.min(140, W * .38), H = data.length * rowH;
  const max = Math.max(1, ...data.map((d) => d.n));
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Open roles per company">${data.map((d, i) => {
    const y = i * rowH, bw = d.n ? Math.max(8, (d.n / max) * (W - labelW - 44)) : 0, off = state.f.company && state.f.company !== d.c.company;
    const name = d.c.company.length > 17 ? d.c.company.slice(0, 16) + "…" : d.c.company;
    return `<g class="${off ? "off" : ""}"><text x="${labelW - 10}" y="${y + 21}" text-anchor="end">${esc(name)}</text>
      <rect x="${labelW}" y="${y + 7}" width="${bw}" height="20" rx="10" fill="var(--bar)"></rect>
      <text class="v" x="${labelW + bw + 8}" y="${y + 22}">${d.n}</text>
      <rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" data-i="${i}"></rect></g>`;
  }).join("")}</svg>`;
  el.querySelectorAll(".hit").forEach((h) => {
    const d = data[h.dataset.i];
    h.addEventListener("mousemove", (e) => showTip(`<b>${esc(d.c.company)}</b>${d.n} matching · ${d.c.scanned} jobs checked${d.c.error ? `<br><span style="color:var(--danger)">Couldn't read this job board</span>` : ""}`, e));
    h.addEventListener("mouseleave", hideTip);
    h.addEventListener("click", () => { state.f.company = state.f.company === d.c.company ? "" : d.c.company; hideTip(); renderMatches(); });
  });
}

function drawList(roles) {
  const R = state.results;
  const blocks = R.companies.filter((c) => !state.f.company || c.company === state.f.company).map((c) => {
    const rs = roles.filter((r) => r.company === c.company).sort((a, b) => (b.payMax ?? -1) - (a.payMax ?? -1));
    const head = `<div class="company-head"><span class="initial" style="${tint(c.company)}">${esc(c.company[0] || "?")}</span>
      <div><b>${esc(c.company)}</b><br><small>${rs.length} role${rs.length === 1 ? "" : "s"}</small></div>
      ${c.board_url ? `<a href="${esc(c.board_url)}" target="_blank" rel="noopener">All jobs ↗</a>` : ""}</div>`;
    const body = c.error ? `<div class="zero bad">I couldn't read this company's job board. Try again later.</div>`
      : !rs.length ? `<div class="zero">No matching roles right now.</div>`
      : rs.map((r) => `<div class="job">
          <a class="title" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>
          <div class="meta"><span>${esc(r.location || "Location not listed")}</span>${r.remote ? '<span class="tag remote">Remote</span>' : ""}${r.payText ? `<span class="tag pay">${esc(r.payText)}</span>` : '<span class="tag nopay">Pay not listed</span>'}</div>
          <a class="view" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">View job</a></div>`).join("");
    return `<div class="company">${head}${body}</div>`;
  });
  $("#list").innerHTML = blocks.join("") || `<div class="zero" style="padding:20px">Nothing matches these filters.</div>`;
}

function download(roles) {
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["Company", "Role", "Location", "Remote", "Pay", "Link"].join(",")].concat(roles.map((r) => [r.company, r.title, r.location, r.remote ? "yes" : "", r.payText, r.url].map(cell).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = `job-scout-${(state.results.query.role || "roles").replace(/\W+/g, "-")}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- Boot ---------- */
(async () => {
  try {
    const s = await (await fetch("/api/chat")).json();
    const missing = Object.entries({ Claude: s.keys.anthropic, Tavily: s.keys.tavily, Firecrawl: s.keys.firecrawl }).filter(([, on]) => !on).map(([k]) => k);
    const notes = [];
    if (missing.length) notes.push(`the ${missing.join(", ")} API key${missing.length > 1 ? "s are" : " is"} missing on the server`);
    if (s.anthropicKeyProblem) notes.push(`ANTHROPIC_API_KEY problem: ${s.anthropicKeyProblem}`);
    if (notes.length) { const b = $("#banner"); b.hidden = false; b.textContent = `Setup needed: ${notes.join(". ")}`; }
  } catch {}
})();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderMatches, 150); });
renderChips(); renderChat(); renderMatches();
</script>
</body>
